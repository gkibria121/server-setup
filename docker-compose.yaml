# docker-compose.yml
services:
  traefik:
    image: traefik:latest
    container_name: traefik
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik-certs:/letsencrypt
    networks:
      - traefik-network
    restart: unless-stopped
      
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Dhaka
    volumes:
      - /mnt/backup:/srv/filebrowser/data/files
      - /mnt/storage/filebrowser.db:/database.db

    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.filebrowser.rule=Host(`filebrowser.gkibria121.com`)"
      - "traefik.http.routers.filebrowser.entrypoints=web"
      - "traefik.http.services.filebrowser.loadbalancer.server.port=80"
    networks:
      - traefik-network
  postgres:
    image: postgres:16
    restart: unless-stopped
    user: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=app
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=toor
    volumes:
      - postgres-data-production:/var/lib/postgresql/data
    networks:
      - traefik-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USERNAME:-laravel} -d ${POSTGRES_DATABASE:-app}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest 
    volumes:
      - ~/.audiobooks/config:/config
      - ~/.audiobooks/metadata:/metadata
      - /mnt/backup/books:/audiobooks
    environment:
      - TZ=Asia/Dhaka
    restart: unless-stopped 
    networks:
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.audiobookshelf.rule=Host(`audiobookshelf.gkibria121.com`)"
      - "traefik.http.routers.audiobookshelf.entrypoints=web"
      - "traefik.http.services.audiobookshelf.loadbalancer.server.port=80"
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Dhaka
      - WEBUI_PORT=8080
      - TORRENTING_PORT=21439
    volumes:
      - ~/.config:/config
      - /mnt/backup/downloads:/downloads   # change to your actual downloads path
      - /mnt/backup/books:/books
      - /mnt/backup/courses:/courses
    ports:
      - "21439:21439"        # torrent traffic - TCP
      - "21439:21439/udp"    # torrent traffic - UDP
      - "8085:8080"
      - "9000:9000"
      - "9000:9000/udp"
    networks:
      - traefik-network
    labels:
      - "traefik.enable=true"
      # --- WebUI router (existing) ---
      - "traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.gkibria121.com`)"
      - "traefik.http.routers.qbittorrent.entrypoints=web"
      - "traefik.http.routers.qbittorrent.service=qbittorrent"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8080"
      # --- Tracker router (new, port 9000) ---
      - "traefik.http.routers.qbittorrent-tracker.rule=Host(`tracker.gkibria121.com`)"
      - "traefik.http.routers.qbittorrent-tracker.entrypoints=web"
      - "traefik.http.routers.qbittorrent-tracker.service=qbittorrent-tracker"
      - "traefik.http.services.qbittorrent-tracker.loadbalancer.server.port=9000" 
  kavita:
    image: lscr.io/linuxserver/kavita:latest
    container_name: kavita
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Dhaka
    volumes:
      - ~/.kavita/config:/config
      - /mnt/backup/books:/data #optional
    restart: unless-stopped   

    networks:
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kavita.rule=Host(`kavita.gkibria121.com`)"
      - "traefik.http.routers.kavita.entrypoints=web"
      - "traefik.http.services.kavita.loadbalancer.server.port=5000" 



volumes:
  
  pgadmin-data:
  postgres-data-production:
  sp_data:
  traefik-certs:
networks:
  traefik-network:
    external: true
